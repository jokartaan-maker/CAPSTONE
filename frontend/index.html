<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Capstone — نظام إدارة مشاريع التخرج</title>
    <style>
      /* ── App Boot Splash ── */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        background: linear-gradient(160deg, #0b1f35 0%, #0e2d4f 50%, #071c32 100%);
        font-family: 'Tajawal', 'Segoe UI', Arial, sans-serif;
        overflow: hidden;
        transition: opacity .35s ease, visibility .35s ease;
      }
      #boot-splash.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* blob decorations */
      #boot-splash::before,
      #boot-splash::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
      }
      #boot-splash::before {
        width: 500px; height: 500px;
        top: -200px; right: -150px;
        background: radial-gradient(circle, rgba(59,130,246,.10) 0%, transparent 65%);
      }
      #boot-splash::after {
        width: 400px; height: 400px;
        bottom: -150px; left: -120px;
        background: radial-gradient(circle, rgba(99,102,241,.08) 0%, transparent 65%);
      }

      .bs-logo {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 48px;
        position: relative;
        z-index: 1;
        animation: bs-down .55s cubic-bezier(.22,.68,0,1.2) both;
      }
      .bs-logo-name {
        font-size: 28px;
        font-weight: 800;
        color: rgba(255,255,255,.92);
        letter-spacing: -.3px;
      }

      .bs-bars {
        display: flex;
        align-items: flex-end;
        gap: 5px;
        height: 36px;
        position: relative;
        z-index: 1;
        margin-bottom: 28px;
      }
      .bs-bar {
        display: block;
        width: 4px;
        border-radius: 999px;
        background: rgba(255,255,255,.75);
        animation: bs-bounce 1.1s ease-in-out infinite;
      }
      .bs-bar:nth-child(1) { height:14px; animation-delay: 0s; }
      .bs-bar:nth-child(2) { height:22px; animation-delay: .13s; }
      .bs-bar:nth-child(3) { height:30px; animation-delay: .26s; }
      .bs-bar:nth-child(4) { height:22px; animation-delay: .39s; }
      .bs-bar:nth-child(5) { height:14px; animation-delay: .52s; }

      .bs-label {
        font-size: 13px;
        font-weight: 600;
        color: rgba(200,220,240,.78);
        position: relative;
        z-index: 1;
        margin: 0;
        animation: bs-up .6s .2s both;
      }
      .bs-tagline {
        font-size: 10.5px;
        color: rgba(180,210,240,.38);
        letter-spacing: .5px;
        margin: 8px 0 0;
        position: relative;
        z-index: 1;
        animation: bs-up .6s .35s both;
      }

      @keyframes bs-down {
        from { opacity:0; transform:translateY(-12px); }
        to   { opacity:1; transform:translateY(0); }
      }
      @keyframes bs-up {
        from { opacity:0; transform:translateY(8px); }
        to   { opacity:1; transform:translateY(0); }
      }
      @keyframes bs-bounce {
        0%,100% { transform:scaleY(.45); opacity:.35; }
        50%     { transform:scaleY(1);   opacity:1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .bs-bar { animation:none; opacity:.6; }
        .bs-logo, .bs-label, .bs-tagline { animation:none; opacity:1; }
      }
    </style>
  </head>
  <body>

    <!-- Splash يظهر قبل React -->
    <div id="boot-splash" role="status" aria-label="جارٍ تحميل التطبيق">
      <div class="bs-logo">
        <span class="bs-logo-name">Capstone</span>
      </div>
      <div class="bs-bars" aria-hidden="true">
        <span class="bs-bar"></span>
        <span class="bs-bar"></span>
        <span class="bs-bar"></span>
        <span class="bs-bar"></span>
        <span class="bs-bar"></span>
      </div>
      <p class="bs-label">جارٍ التحميل...</p>
      <p class="bs-tagline">منصة إدارة مشاريع التخرج</p>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
